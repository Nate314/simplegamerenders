<!DOCTYPE html>
<html lang="en">
<head>
    <!--
         __    __    __      __    ______
        |NN\  |NN|  |MM\    /MM|  /GGGGGG|
        |NN|\ |NN|  |MM|\  /|MM|  |G| ____
        |NN| \|NN|  |MM| \/ |MM|  |G|  |GG|
        |NN|  \NN|  |MM|    |MM|  \GGGGGGG|
    -->
    <!-- use to render a month view of a public Google Calendar -->
    <!-- example: ?calendarId=calendar.driftwood%40gmail.com&tz=America%2FChicago -->
    <!-- optional: &month=2026-08 (defaults to current month) -->
    <!-- optional: &theme=dark|light (defaults to dark) -->
    <!-- optional: &interactive=true (adds month nav + theme toggle buttons) -->
    <!-- event summaries starting with "[Tag]" are colored per-tag with a legend -->
    <!-- optional, repeatable: &locationEmoji=<regex>:<emoji> prepends an emoji to -->
    <!-- matching locations' badges, e.g. &locationEmoji=church:%E2%9B%AA -->
    <!-- (case-insensitive regex match against the location text; first match wins) -->
    <!-- optional: &apiKey=<Google Cloud API key> switches from the iCal export -->
    <!-- (needs a CORS proxy, works locally but corsproxy.io blocks real domains -->
    <!-- on its free tier) to the real Google Calendar API v3, which sends its -->
    <!-- own CORS headers -- use this for production/GitHub Pages deployments -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Renderer</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
    <style>
* {
    margin: 0;
    padding: 0;
    border: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
}

body {
    font-family: sans-serif;
}

.calendar-page {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

.btn-bar {
    padding: 8px;
    flex-shrink: 0;
}

.btn-bar input[type="checkbox"] {
    pointer-events: none;
}

.month-title {
    flex-shrink: 0;
    padding: 4px 0;
}

.main-area {
    flex: 1;
    display: flex;
    min-height: 0;
}

.legend-sidebar {
    flex-shrink: 0;
    width: 180px;
    overflow-y: auto;
    padding: 4px;
    border-left: 1px solid #4a4d53;
    scrollbar-width: thin;
}

.legend {
    display: flex;
    flex-direction: column;
    padding: 2px 8px;
    font-size: 0.75em;
}

.legend-label {
    font-weight: bold;
    margin-top: 2px;
}

.legend-item {
    display: flex;
    align-items: center;
    padding-left: 4px;
}

.legend-swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    margin-right: 4px;
    flex-shrink: 0;
}

.calendar-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    min-height: 0;
    min-width: 0;
}

.day-header {
    font-weight: bold;
    text-align: center;
    padding: 4px;
    border: 1px solid #4a4d53;
}

.day-cell {
    border: 1px solid #4a4d53;
    padding: 4px;
    overflow-y: auto;
    min-height: 0;
    scrollbar-width: thin;
}

.theme-dark .day-cell, .theme-dark .legend-sidebar {
    scrollbar-color: #5a5d63 transparent;
}

.theme-light .day-cell, .theme-light .legend-sidebar {
    scrollbar-color: #c0c0c0 transparent;
}

.theme-dark .day-cell::-webkit-scrollbar, .theme-dark .legend-sidebar::-webkit-scrollbar {
    width: 8px;
}

.theme-dark .day-cell::-webkit-scrollbar-track, .theme-dark .legend-sidebar::-webkit-scrollbar-track {
    background: transparent;
}

.theme-dark .day-cell::-webkit-scrollbar-thumb, .theme-dark .legend-sidebar::-webkit-scrollbar-thumb {
    background: #5a5d63;
    border-radius: 4px;
}

.theme-light .day-cell::-webkit-scrollbar, .theme-light .legend-sidebar::-webkit-scrollbar {
    width: 8px;
}

.theme-light .day-cell::-webkit-scrollbar-track, .theme-light .legend-sidebar::-webkit-scrollbar-track {
    background: transparent;
}

.theme-light .day-cell::-webkit-scrollbar-thumb, .theme-light .legend-sidebar::-webkit-scrollbar-thumb {
    background: #c0c0c0;
    border-radius: 4px;
}

.day-cell-today {
    box-shadow: inset 0 0 0 2px #4a90d9;
    background: rgba(74, 144, 217, 0.15);
}

.day-number {
    font-weight: bold;
    font-size: 0.9em;
}

.event {
    font-size: 0.7em;
    margin-top: 2px;
    padding-left: 4px;
}

.event-title {
    font-weight: 600;
}

.event-detail {
    opacity: 0.85;
}

@media print {
    @page {
        size: landscape;
    }

    .btn-bar {
        display: none !important;
    }

    .day-cell-today {
        box-shadow: none !important;
        background: none !important;
    }

    .calendar-page {
        background: #FFFFFF !important;
        color: #000000 !important;
        height: auto !important;
        overflow: visible !important;
    }

    .main-area {
        overflow: visible !important;
    }

    .day-cell, .legend-sidebar {
        overflow: visible !important;
        page-break-inside: avoid;
        break-inside: avoid;
    }
}
    </style>
</head>
<body>
    <div id="content"></div>
    <script src="index.js"></script>
</body>
</html>
