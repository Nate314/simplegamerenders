<!DOCTYPE html>
<html lang="en">
<head>
    <!--
         __    __    __      __    ______
        |NN\  |NN|  |MM\    /MM|  /GGGGGG|
        |NN|\ |NN|  |MM|\  /|MM|  |G| ____
        |NN| \|NN|  |MM| \/ |MM|  |G|  |GG|
        |NN|  \NN|  |MM|    |MM|  \GGGGGGG|
    -->
    <!-- use to render a month view of a public Google Calendar -->
    <!-- example: ?calendarId=calendar.driftwood%40gmail.com&tz=America%2FChicago -->
    <!-- optional: &month=2026-08 (defaults to current month) -->
    <!-- optional: &theme=dark|light (defaults to dark) -->
    <!-- optional: &interactive=true (adds month nav + theme toggle buttons) -->
    <!-- event summaries starting with "[Tag]" are colored per-tag with a legend -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Renderer</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
    <style>
* {
    margin: 0;
    padding: 0;
    border: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
}

body {
    font-family: sans-serif;
}

.calendar-page {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

.btn-bar {
    padding: 8px;
    flex-shrink: 0;
}

.month-title {
    flex-shrink: 0;
    padding: 4px 0;
}

.legend {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 4px 12px;
    font-size: 0.75em;
}

.legend-item {
    display: flex;
    align-items: center;
}

.legend-swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    margin-right: 4px;
}

.calendar-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    min-height: 0;
}

.day-header {
    font-weight: bold;
    text-align: center;
    padding: 4px;
    border: 1px solid #4a4d53;
}

.day-cell {
    border: 1px solid #4a4d53;
    padding: 4px;
    overflow-y: auto;
    min-height: 0;
}

.day-number {
    font-weight: bold;
    font-size: 0.9em;
}

.event {
    font-size: 0.7em;
    margin-top: 2px;
    padding-left: 4px;
}

.event-title {
    font-weight: 600;
}

.event-detail {
    opacity: 0.85;
}
    </style>
</head>
<body>
    <div id="content"></div>
    <script src="index.js"></script>
</body>
</html>
